<div class="container">
  <h1>Nueva Recompensa</h1>

  <form class="atraccion-form" (ngSubmit)="onSubmit()">
    <!-- Nombre -->
    <div class="form-field">
      <label class="form-label" for="nombre">Nombre *</label>
      <input
        type="text"
        id="nombre"
        [(ngModel)]="recompensa.nombre"
        name="nombre"
        class="form-input"
        placeholder="Ej: Descuento 10%"
        required>
    </div>

    <!-- Descripción -->
    <div class="form-field">
      <label class="form-label" for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        [(ngModel)]="recompensa.descripcion"
        name="descripcion"
        class="form-textarea"
        placeholder="Descripción opcional de la recompensa"></textarea>
    </div>

    <!-- Costo en Puntos -->
    <div class="form-field">
      <label class="form-label" for="costoEnPuntos">Costo en Puntos *</label>
      <input
        type="number"
        id="costoEnPuntos"
        [(ngModel)]="recompensa.costoEnPuntos"
        name="costoEnPuntos"
        class="form-input"
        min="1"
        required>
    </div>

    <!-- Cantidad Disponible -->
    <div class="form-field">
      <label class="form-label" for="cantidadDisponible">Cantidad Disponible *</label>
      <input
        type="number"
        id="cantidadDisponible"
        [(ngModel)]="recompensa.cantidadDisponible"
        name="cantidadDisponible"
        class="form-input"
        min="0"
        required>
    </div>

    <!-- Nivel Membresía -->
    <div class="form-field">
      <label class="form-label" for="nivelMembresia">Nivel de Membresía Requerido</label>
      <select
        id="nivelMembresia"
        [(ngModel)]="recompensa.nivelMembresiaRequerido"
        name="nivelMembresiaRequerido"
        class="form-select">
        <option [ngValue]="nivel.valor" *ngFor="let nivel of nivelesMembresia">
          {{ nivel.etiqueta }}
        </option>
      </select>
    </div>

    <!-- Botones -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/recompensas">
        Cancelar
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="submitting()">
        {{ submitting() ? 'Creando...' : 'Crear Recompensa' }}
      </button>
    </div>
  </form>
</div>
