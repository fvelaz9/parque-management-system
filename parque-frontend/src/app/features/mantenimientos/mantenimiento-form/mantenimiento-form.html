<div class="container">
  <h1>Programar Mantenimiento Preventivo</h1>

  <form class="atraccion-form" (ngSubmit)="onSubmit()" #mantenimientoForm="ngForm">

    <!-- Selección de Atracción con checkboxes -->
    <div class="form-field">
      <label class="form-label">Seleccionar Atracción *</label>
      <div *ngIf="loading()" class="text-center py-3">
        <div class="spinner-border spinner-border-sm" role="status">
          <span class="visually-hidden">Cargando atracciones...</span>
        </div>
      </div>
      <div *ngIf="!loading()">
        <div *ngFor="let atraccion of atracciones()" class="form-check mb-2">
          <input
            class="form-check-input"
            type="radio"
            [name]="'atraccion'"
            [id]="'atraccion-' + atraccion.id"
            [value]="atraccion.id"
            [(ngModel)]="mantenimiento.atraccionId"
            required>
          <label class="form-check-label" [for]="'atraccion-' + atraccion.id">
            <strong>{{ atraccion.nombre }}</strong> (ID: {{ atraccion.id }})
          </label>
        </div>
      </div>
    </div>

    <!-- Fecha Programada -->
    <div class="form-field">
      <label class="form-label" for="fechaProgramada">Fecha Programada *</label>
      <input
        type="date"
        id="fechaProgramada"
        name="fechaProgramada"
        class="form-input"
        [(ngModel)]="mantenimiento.fechaProgramada"
        required>
    </div>

    <!-- Hora de Inicio -->
    <div class="form-field">
      <label class="form-label" for="horaInicio">Hora de Inicio *</label>
      <input
        type="time"
        id="horaInicio"
        name="horaInicio"
        class="form-input"
        [(ngModel)]="mantenimiento.horaInicio"
        required>
    </div>

    <!-- Duración Estimada -->
    <div class="form-field">
      <label class="form-label" for="duracionEstimada">Duración Estimada (horas) *</label>
      <input
        type="number"
        id="duracionEstimada"
        name="duracionEstimada"
        class="form-input"
        [(ngModel)]="mantenimiento.duracionEstimada"
        min="0.5"
        step="0.5"
        placeholder="Ej: 2.5"
        required>
      <small class="form-text text-muted">Ingrese la duración en horas (puede usar decimales)</small>
    </div>

    <!-- Descripción -->
    <div class="form-field">
      <label class="form-label" for="descripcion">Descripción del Mantenimiento *</label>
      <textarea
        id="descripcion"
        name="descripcion"
        class="form-textarea"
        [(ngModel)]="mantenimiento.descripcion"
        placeholder="Describa las tareas del mantenimiento preventivo..."
        required></textarea>
    </div>

    <!-- Botones -->
    <div class="form-actions">
      <button
        type="button"
        class="btn btn-secondary"
        routerLink="/mantenimientos">
        Cancelar
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!mantenimientoForm.form.valid || submitting()">
        <span *ngIf="submitting()">Guardando...</span>
        <span *ngIf="!submitting()">Guardar</span>
      </button>
    </div>
  </form>
</div>
