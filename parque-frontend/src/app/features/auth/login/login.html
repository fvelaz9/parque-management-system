<div class="login-container">
  <div class="login-card">
    <h2>Parque Temático Virtual</h2>
    <h3>Iniciar Sesión</h3>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email"
          class="form-control"
          formControlName="email"
          placeholder="ejemplo@correo.com"
          [class.is-invalid]="f['email'].invalid && f['email'].touched">
        
        <!-- Mensajes de error -->
        <div *ngIf="f['email'].invalid && f['email'].touched" class="invalid-feedback">
          <small *ngIf="f['email'].errors?.['required']">El email es requerido</small>
          <small *ngIf="f['email'].errors?.['email']">Formato de email inválido</small>
        </div>
      </div>

      <!-- Campo Password -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password"
          class="form-control"
          formControlName="password"
          placeholder="Ingrese su contraseña"
          [class.is-invalid]="f['password'].invalid && f['password'].touched">
        
        <!-- Mensajes de error -->
        <div *ngIf="f['password'].invalid && f['password'].touched" class="invalid-feedback">
          <small *ngIf="f['password'].errors?.['required']">La contraseña es requerida</small>
          <small *ngIf="f['password'].errors?.['minlength']">Mínimo 6 caracteres</small>
        </div>
      </div>

      <!-- Mensaje de error general -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <!-- Botón de envío -->
      <button 
        type="submit" 
        class="btn btn-primary btn-block" 
        [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <div class="registro-link">
        ¿No tenés cuenta? <a routerLink="/registro-visitante">Regístrate aquí</a>
      </div>
    </form>
  </div>
</div>
